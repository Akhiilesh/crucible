[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crucible"
version = "0.1.0"
description = "Proof-carrying code review agent built on IBM Bob 2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
crucible = "crucible.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests", "demo-app/tests"]
